<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketGen | Buscar boleto</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-button menu-toggle" type="button" aria-label="Abrir menú">
        ☰
      </button>
      <span class="brand">TicketGen</span>
      <span class="login-indicator" id="login-indicator">
        <span class="login-avatar" aria-hidden="true"></span>
        <span class="login-name"></span>
      </span>
    </header>
    <nav class="menu" id="menu">
      <div class="menu-backdrop" data-close-menu="true"></div>
      <div class="menu-panel">
        <h2>Menú</h2>
        <a href="index.html">Home</a>
        <a href="mis-boletos.html" data-auth="required" data-admin-only>Boletos de venta</a>
        <a href="boletos-sin-pagar.html" data-auth="required" data-admin-only>Boletos sin pagar</a>
        <a href="compra-boletos.html" data-admin-only>Generación de boletos</a>
        <a href="miembros-visitas.html" data-admin-only>Miembros y Visitas</a>
        <a href="buscar-boleto.html">Buscar boleto</a>
        <a href="escanear-entrada.html">Escanear entrada</a>
        <a href="escanear-salida.html">Escanear salida</a>
        <button class="menu-logout" type="button">Cerrar sesión</button>
      </div>
    </nav>

    <main class="page">
      <section class="card card-wide">
        <header class="section-header">
          <div>
            <h1>Buscar boleto</h1>
            <p class="subtitle">
              Busca por ID parcial en boletos de venta y en registros de miembros o visitas.
            </p>
          </div>
          <a class="secondary-link" href="index.html">Volver al home</a>
        </header>

        <form class="search-form" id="search-form">
          <label class="field search-field">
            ID del boleto o registro
            <input
              type="search"
              id="search-query"
              name="q"
              placeholder="Ej: TG-12, MV-A1B2C3D4"
              autocomplete="off"
              required
              minlength="2"
            />
          </label>
          <button class="primary-link button" type="submit">Buscar</button>
        </form>

        <p id="search-status" class="helper" aria-live="polite"></p>

        <div id="search-results" class="search-results-grid" hidden></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="app-config.js"></script>
    <script src="menu.js"></script>
    <script src="buscar-boleto.js"></script>
  </body>
</html>
